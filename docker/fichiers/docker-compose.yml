services:
  web:
    image: nginx:alpine
    container_name: php_web_nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html
    ports:
      - "80:80"
    depends_on:
      - php
    networks:
      - app-network

  php:
    build:
      context: .
      dockerfile: docker/DockerfilePHP
    container_name: php_web_app
    expose:
      - 9000
    volumes:
      - ./:/var/www/html
      - ./docker/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./docker/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini
    environment:
      PHP_IDE_CONFIG: "serverName=Docker"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.3
    container_name: php_web_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: test
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: php_web_phpmyadmin
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    networks:
      - app-network

  css-windows:
    build:
      context: .
      dockerfile: docker/DockerfileTailwindCSS
    container_name: web_tailwindcss
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: ["./input.css", "./output.css"]
    networks:
      - app-network

  # css-linux:
  #   image: node:latest
  #   working_dir: /var/www/html
  #   volumes:
  #     - ./:/var/www/html
  #   # Garder seulement une des deux lignes de commande suivantes selon que vous utilisez Sass ou Tailwind CSS
  #   #command: sh -c "npm install -g sass && sass --watch .:. --no-source-map"
  #   command: sh -c "npm install tailwindcss @tailwindcss/cli && npx @tailwindcss/cli -i ./input.css -o ./output.css --watch"
  #   networks:
  #     - app-network
      
networks:
  app-network:
    driver: bridge

volumes:
  db_data: